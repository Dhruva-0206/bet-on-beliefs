[workspace]
resolver = "2"
members = ["contracts/market-math", "contracts/belief-ft", "contracts/tusd-ft"]

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
uint = "=0.10.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
